<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Your LxParking OTP</title><style> body {font-family: 'Segoe UI', 'Times New Roman', 'Roboto', sans-serif;background-color: #fece34;background-image: linear-gradient(135deg, #fffbe6 0%, #fece34 100%);background-repeat: no-repeat;background-size: cover;margin: 0;padding: 0;}  .email-container {background: #fff url('https://i.postimg.cc/3JwQw2gk/confetti-bg.png') repeat;border-radius: 16px;box-shadow: 0 4px 24px rgba(165, 123, 10, 0.10);padding: 36px 28px;max-width: 420px;width: 100%;text-align: center;border: 2px solid #fece34;margin: 40px auto;position: relative;overflow: hidden;background-blend-mode: lighten;}  .email-container::before {content: '';position: absolute;top: 0; left: 0; right: 0; bottom: 0;pointer-events: none;border-radius: 16px;background-repeat: repeat;background-size: 200px 200px;opacity: 0.5;z-index: 0;}  .email-container > * {position: relative;z-index: 1;}  .top-confetti {width: 100%;height: 200px;background-size: cover;border-top-left-radius: 16px;border-top-right-radius: 16px;position: absolute;left: 0;top: 0;z-index: 1;pointer-events: none;}  .logo {width: 80px;margin-bottom: 16px;display: block;margin-left: auto;margin-right: auto;}  h2 {color: #a57b0a;margin-bottom: 12px;font-weight: bold;font-size: 1.7rem;font-family: 'Times New Roman', serif;letter-spacing: 2px;text-shadow: 0 2px 8px #fece3444;}  .greeting {font-size: 1.18rem;margin-bottom: 18px;color: #a57b0a;font-weight: bold;font-family: 'Times New Roman', serif;}  .otp-box {font-size: 1.8rem;letter-spacing: 6px;color: #fff;background: linear-gradient(90deg, #a57b0a 0%, #fece34 100%);border-radius: 8px;padding: 14px 0;margin-bottom: 20px;font-weight: bold;box-shadow: 0 2px 8px #fece3444;font-family: 'Segoe UI', 'Times New Roman', serif;}  .footer {font-size: 1rem;color: #a57b0a;margin-top: 60px;font-family: 'Segoe UI', 'Times New Roman', serif;}</style></head><body><div class="email-container"><div class="top-confetti"></div><img class="logo" src="https://i.postimg.cc/nzxwZjyT/logo.png" width="80" height="80" alt="LxParking Logo" /><h2>OTP Verification</h2><div class="greeting">Hi {employee},</div><div style="margin-bottom:24px; margin-top: 50px;">Use the OTP below to complete your verification.</div><div class="otp-box">{otp}</div><div style="margin-bottom:18px;">This OTP is valid for <b>{expiryMinutes} minutes</b>.</div><div class="footer">Keep this OTP confidential.<br>If you didn’t request it, please ignore this email.<br><br>Best regards,<br>LxParking Team</div></div></body></html>
